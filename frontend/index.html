<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-start: #0a0e27;
            --bg-mid: #131b3a;
            --bg-end: #0d1117;
            --glass: rgba(22, 27, 34, 0.6);
            --glass-border: rgba(88, 166, 255, 0.15);
            --card: rgba(22, 27, 34, 0.75);
            --border: rgba(48, 54, 61, 0.6);
            --text: #c9d1d9;
            --text-bright: #f0f6fc;
            --text-muted: #8b949e;
            --green: #3fb950;
            --green-glow: rgba(63, 185, 80, 0.3);
            --red: #f85149;
            --red-glow: rgba(248, 81, 73, 0.3);
            --blue: #58a6ff;
            --blue-glow: rgba(88, 166, 255, 0.3);
            --accent: #1f6feb;
            --purple: #8957e5;
            --cyan: #56d4dd;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-end);
            background-image: 
                radial-gradient(ellipse at top, rgba(31, 111, 235, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(137, 87, 229, 0.1) 0%, transparent 50%),
                linear-gradient(180deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
            background-attachment: fixed;
            color: var(--text);
            padding: 20px 16px;
            max-width: 900px;
            margin: 0 auto;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-6px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        @keyframes barGrow {
            from { transform: scaleY(0); }
            to { transform: scaleY(1); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* Header */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
            gap: 8px;
            animation: fadeIn 0.5s ease;
            text-align: center;
        }
        h1 { 
            font-size: 2.2rem; 
            letter-spacing: -1px;
            text-align: center;
            font-weight: 800;
            background: linear-gradient(135deg, #58a6ff 0%, #56d4dd 50%, #a371f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 8px rgba(88, 166, 255, 0.3));
        }
        .subtitle {
            font-size: 12.5px;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            font-weight: 400;
        }

        /* Controls */
        .controls { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            margin-top: 12px;
        }

        /* Date input */
        input[type="date"]#dateFilter {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 13px;
            color-scheme: dark;
            transition: all 0.2s ease;
            font-family: inherit;
            width: 175px;
            min-width: 175px;
            max-width: 175px;
            text-align: center;
            cursor: pointer;
            position: relative;
        }
        input[type="date"]#dateFilter:hover { 
            border-color: rgba(88, 166, 255, 0.4);
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.1);
        }
        input[type="date"]#dateFilter:focus { 
            outline: none; 
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15), 0 0 20px rgba(88, 166, 255, 0.2);
        }
        input[type="date"]#dateFilter.empty-date::-webkit-datetime-edit {
            color: transparent;
        }
        input[type="date"]#dateFilter.empty-date::before {
            content: "dd/mm/yyyy";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(139, 148, 158, 0.5);
            pointer-events: none;
            font-size: 13px;
            z-index: 1;
        }
        input[type="date"]#dateFilter::-webkit-calendar-picker-indicator {
            cursor: pointer;
            filter: invert(0.8);
            opacity: 0.7;
        }
        input[type="date"]#dateFilter::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }

        /* Buttons */
        button {
            background: rgba(35, 134, 54, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: white;
            border: 1px solid rgba(63, 185, 80, 0.3);
            padding: 11px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.25s ease;
            font-family: inherit;
            letter-spacing: 0.2px;
        }
        button:hover { 
            background: rgba(46, 160, 67, 0.9);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px var(--green-glow);
            border-color: rgba(63, 185, 80, 0.6);
        }
        button:active { transform: translateY(0); }
        button:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
            transform: none;
            box-shadow: none;
        }
        button.clear { 
            background: var(--glass);
            border-color: var(--border);
        }
        button.clear:hover { 
            background: rgba(48, 54, 61, 0.8);
            box-shadow: 0 4px 20px rgba(139, 148, 158, 0.2);
        }
        button.export { 
            background: rgba(31, 111, 235, 0.8);
            border-color: rgba(88, 166, 255, 0.3);
        }
        button.export:hover { 
            background: rgba(56, 139, 253, 0.9);
            box-shadow: 0 4px 20px var(--blue-glow);
            border-color: rgba(88, 166, 255, 0.6);
        }
        button.csv { 
            background: rgba(137, 87, 229, 0.8);
            border-color: rgba(163, 113, 247, 0.3);
        }
        button.csv:hover { 
            background: rgba(163, 113, 247, 0.9);
            box-shadow: 0 4px 20px rgba(137, 87, 229, 0.4);
            border-color: rgba(163, 113, 247, 0.6);
        }
        button.pdf { 
            background: rgba(218, 54, 51, 0.8);
            border-color: rgba(248, 81, 73, 0.3);
        }
        button.pdf:hover { 
            background: rgba(248, 81, 73, 0.9);
            box-shadow: 0 4px 20px var(--red-glow);
            border-color: rgba(248, 81, 73, 0.6);
        }

        /* Summary cards */
        .pnl-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }
        .pnl-card {
            background: var(--card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 14px;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease backwards;
            position: relative;
            overflow: hidden;
        }
        .pnl-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(88, 166, 255, 0.5), transparent);
        }
        .pnl-card:hover {
            border-color: rgba(88, 166, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(88, 166, 255, 0.15);
        }
        .pnl-card:nth-child(1) { animation-delay: 0.05s; }
        .pnl-card:nth-child(2) { animation-delay: 0.1s; }
        .pnl-card:nth-child(3) { animation-delay: 0.15s; }
        .pnl-card:nth-child(4) { animation-delay: 0.2s; }
        .pnl-card:nth-child(5) { animation-delay: 0.25s; }
        .pnl-card:nth-child(6) { animation-delay: 0.3s; }
        .pnl-card .label {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
        }
        .pnl-card .value {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .pnl-card .sub {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 3px;
        }
        .pos { color: var(--green); text-shadow: 0 0 12px var(--green-glow); }
        .neg { color: var(--red); text-shadow: 0 0 12px var(--red-glow); }

        /* Chart */
        .chart-container {
            background: var(--card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 18px;
            animation: fadeIn 0.6s ease 0.15s backwards;
            position: relative;
            overflow: hidden;
        }
        .chart-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(137, 87, 229, 0.5), transparent);
        }
        .chart-title {
            font-size: 13px;
            color: var(--text-bright);
            margin-top: 0;
            margin-bottom: 10px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.3px;
        }
        .chart-bars {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 130px;
            padding-top: 20px;
            padding-bottom: 22px;
            position: relative;
        }
        .bar-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            position: relative;
            min-width: 0;
        }
        .bar {
            width: 100%;
            max-width: 38px;
            border-radius: 6px 6px 0 0;
            min-height: 4px;
            transition: all 0.3s ease;
            animation: barGrow 0.6s ease backwards;
            transform-origin: bottom;
            cursor: pointer;
        }
        .bar-wrapper:nth-child(1) .bar { animation-delay: 0.1s; }
        .bar-wrapper:nth-child(2) .bar { animation-delay: 0.15s; }
        .bar-wrapper:nth-child(3) .bar { animation-delay: 0.2s; }
        .bar-wrapper:nth-child(4) .bar { animation-delay: 0.25s; }
        .bar-wrapper:nth-child(5) .bar { animation-delay: 0.3s; }
        .bar-wrapper:nth-child(6) .bar { animation-delay: 0.35s; }
        .bar-wrapper:nth-child(7) .bar { animation-delay: 0.4s; }
        .bar.pos-bar { 
            background: linear-gradient(180deg, #56d364 0%, #238636 100%);
            box-shadow: 0 0 16px rgba(63, 185, 80, 0.4);
        }
        .bar.neg-bar { 
            background: linear-gradient(180deg, #ff7b72 0%, #da3633 100%);
            box-shadow: 0 0 16px rgba(248, 81, 73, 0.4);
        }
        .bar:hover { 
            filter: brightness(1.3); 
            transform: scaleY(1.02);
        }
        .bar-label {
            position: absolute;
            bottom: -20px;
            font-size: 9.5px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        .bar-value {
            position: absolute;
            top: -16px;
            font-size: 9.5px;
            font-weight: 700;
            white-space: nowrap;
        }

        /* Date group */
        .date-group { 
            margin-bottom: 22px;
            animation: fadeIn 0.4s ease backwards;
        }
        .date-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .date-title { 
            font-size: 13px; 
            font-weight: 700; 
            color: var(--text-bright);
            letter-spacing: 0.2px;
        }
        .date-stats {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            font-weight: 500;
        }

        /* Trade card */
        .trade-card {
            background: var(--card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            animation: slideIn 0.4s ease backwards;
            position: relative;
            overflow: hidden;
        }
        .trade-card:hover {
            border-color: rgba(88, 166, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transform: translateY(-1px);
        }
        .trade-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .symbol { 
            font-weight: 800; 
            font-size: 1.05rem; 
            color: var(--text-bright);
            letter-spacing: -0.3px;
        }
        .side-buy { 
            color: var(--green); 
            font-weight: 700; 
            font-size: 12px;
            padding: 4px 10px;
            background: rgba(63, 185, 80, 0.15);
            border: 1px solid rgba(63, 185, 80, 0.3);
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(63, 185, 80, 0.15);
        }
        .side-sell { 
            color: var(--red); 
            font-weight: 700; 
            font-size: 12px;
            padding: 4px 10px;
            background: rgba(248, 81, 73, 0.15);
            border: 1px solid rgba(248, 81, 73, 0.3);
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(248, 81, 73, 0.15);
        }

        .auto-info {
            background: rgba(13, 17, 23, 0.5);
            border: 1px solid rgba(48, 54, 61, 0.4);
            border-radius: 10px;
            padding: 11px;
            margin-bottom: 11px;
            font-size: 11.5px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 9px;
        }
        .auto-info .item {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }
        .auto-info .item .lbl { color: var(--text-muted); font-weight: 500; }
        .auto-info .item .val { color: var(--text); font-weight: 600; }

        .exit-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
            margin-bottom: 11px;
        }
        .input-box { display: flex; flex-direction: column; }
        .input-box label {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .input-box input {
            background: rgba(13, 17, 23, 0.6);
            border: 1px solid rgba(48, 54, 61, 0.5);
            border-radius: 9px;
            padding: 9px 11px;
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
            width: 100%;
            transition: all 0.2s ease;
        }
        .input-box input:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15), 0 0 16px rgba(88, 166, 255, 0.15);
        }
        .input-box input.highlight { 
            border-color: rgba(158, 106, 3, 0.6);
            background: rgba(158, 106, 3, 0.1);
            box-shadow: 0 0 16px rgba(158, 106, 3, 0.15);
        }
        .input-box input.highlight:focus {
            box-shadow: 0 0 0 3px rgba(158, 106, 3, 0.2), 0 0 16px rgba(158, 106, 3, 0.2);
        }
        .input-box input[type="number"]::-webkit-outer-spin-button,
        .input-box input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none; margin: 0;
        }
        .input-box input[type="number"] { -moz-appearance: textfield; }

        textarea {
            width: 100%;
            background: rgba(13, 17, 23, 0.6);
            border: 1px solid rgba(48, 54, 61, 0.5);
            border-radius: 9px;
            padding: 10px 11px;
            color: var(--text);
            font-size: 12.5px;
            resize: vertical;
            min-height: 48px;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        textarea:focus { 
            outline: none; 
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }
        textarea::placeholder { color: #484f58; }

        .empty { 
            text-align: center; 
            color: #484f58; 
            padding: 60px 20px;
            font-size: 13.5px;
            animation: fadeIn 0.4s ease;
        }
        .loading { 
            text-align: center; 
            color: var(--text-muted); 
            padding: 40px 0;
            animation: pulse 1.5s ease infinite;
        }
        .status { 
            font-size: 12px; 
            color: var(--text-muted); 
            margin-bottom: 10px; 
            min-height: 18px;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: 500;
        }
        .section-title {
            font-size: 14px;
            color: var(--text-bright);
            font-weight: 700;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--glass-border);
            letter-spacing: 0.2px;
        }

        .open-badge {
            background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
            color: #fff;
            font-size: 9px;
            padding: 3px 8px;
            border-radius: 10px;
            margin-left: 6px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 0 12px var(--green-glow);
            animation: pulse 2s ease infinite;
        }

        .close-badge {
            background: linear-gradient(135deg, #da3633 0%, #f85149 100%);
            color: #fff;
            font-size: 9px;
            padding: 3px 8px;
            border-radius: 10px;
            margin-left: 6px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 0 12px var(--red-glow);
        }

        @media (max-width: 480px) {
            body { padding: 14px 12px; }
            h1 { font-size: 1.8rem; }
            .pnl-summary { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .pnl-card { padding: 11px; }
            .pnl-card .value { font-size: 1rem; }
            .pnl-card .label { font-size: 9px; }
            .pnl-card .sub { font-size: 8.5px; }
            .auto-info { font-size: 11px; padding: 9px; }
            .exit-row { gap: 6px; }
            .bar-label { font-size: 9px; }
            .bar-value { font-size: 9px; }
            button { padding: 10px 14px; font-size: 12px; }
            input[type="date"]#dateFilter { 
                width: 150px; 
                min-width: 150px; 
                max-width: 150px; 
                padding: 10px 10px; 
                font-size: 12px; 
            }
            input[type="date"]#dateFilter.empty-date::before {
                font-size: 12px;
            }
            .chart-title { font-size: 12px; }
            .chart-bars { height: 120px; padding-top: 18px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Trading Journal</h1>
        <div class="subtitle">Track your trades with precision</div>
        <div class="controls">
            <input type="date" id="dateFilter" onchange="loadTrades()">
            <button class="clear" onclick="clearFilter()">All</button>
            <button onclick="syncOrders()" id="syncBtn">🔄 Sync</button>
            <button class="csv" onclick="exportCSV()">📄 CSV</button>
            <button class="export" onclick="exportExcel()">📊 Excel</button>
            <button class="pdf" onclick="exportPDF()">📕 PDF</button>
        </div>
    </header>
    <div class="status" id="status"></div>

    <div class="pnl-summary" id="pnlSummary"></div>

    <div class="chart-container">
        <div class="chart-title">Last 7 Days PnL</div>
        <div class="chart-bars" id="chartBars"></div>
    </div>

    <div class="section-title">📋 All Trades</div>
    <div id="trades"><div class="loading">Loading...</div></div>

    <script>
        let allTrades = [];

        function updateDatePlaceholder() {
            const dateInput = document.getElementById('dateFilter');
            if (dateInput.value) {
                dateInput.classList.remove('empty-date');
            } else {
                dateInput.classList.add('empty-date');
            }
        }

        async function loadTrades() {
            const date = document.getElementById('dateFilter').value;
            const url = date ? `/api/trades?date=${date}` : '/api/trades';
            const res = await fetch(url);
            allTrades = await res.json();
            renderSummary(allTrades);
            renderChart(allTrades);
            renderTrades(allTrades);
            updateDatePlaceholder();
        }

        function calcNetPnl(trades) {
            return trades.reduce((sum, t) => {
                if (!t.exit_price) return sum;
                return sum + (t.pnl || 0) + (t.funding || 0) - (t.fee || 0);
            }, 0);
        }

        function renderSummary(trades) {
            const today = new Date().toISOString().split('T')[0];
            const todayTrades = trades.filter(t => t.trade_time && t.trade_time.startsWith(today));
            const todayPnl = calcNetPnl(todayTrades);

            const weekAgo = new Date();
            weekAgo.setDate(weekAgo.getDate() - 7);
            const weekTrades = trades.filter(t => t.trade_time && new Date(t.trade_time) >= weekAgo);
            const weekPnl = calcNetPnl(weekTrades);

            const monthStart = new Date();
            monthStart.setDate(1);
            monthStart.setHours(0, 0, 0, 0);
            const monthTrades = trades.filter(t => t.trade_time && new Date(t.trade_time) >= monthStart);
            const monthPnl = calcNetPnl(monthTrades);

            const allPnl = calcNetPnl(trades);
            const closedTrades = trades.filter(t => t.exit_price);
            const wins = closedTrades.filter(t => calcNetPnl([t]) > 0).length;
            const winRate = closedTrades.length ? ((wins / closedTrades.length) * 100).toFixed(1) : 0;

            const avgPnl = closedTrades.length ? (allPnl / closedTrades.length) : 0;

            const cards = [
                { label: 'Today PnL', value: todayPnl, sub: `${todayTrades.length} trades` },
                { label: 'This Week', value: weekPnl, sub: `${weekTrades.length} trades` },
                { label: 'This Month', value: monthPnl, sub: `${monthTrades.length} trades` },
                { label: 'All Time', value: allPnl, sub: `${trades.length} trades` },
                { label: 'Avg PnL', value: avgPnl, sub: `per trade` },
                { label: 'Win Rate', value: winRate, sub: `${wins} wins`, isPercent: true }
            ];

            document.getElementById('pnlSummary').innerHTML = cards.map(c => {
                const cls = c.isPercent ? '' : (c.value >= 0 ? 'pos' : 'neg');
                const sign = c.isPercent ? '' : (c.value >= 0 ? '+' : '-');
                const display = c.isPercent ? `${c.value}%` : `${sign}$${Math.abs(c.value).toFixed(2)}`;
                return `
                    <div class="pnl-card">
                        <div class="label">${c.label}</div>
                        <div class="value ${cls}">${display}</div>
                        <div class="sub">${c.sub}</div>
                    </div>
                `;
            }).join('');
        }

        function renderChart(trades) {
            const days = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dateKey = d.toISOString().split('T')[0];
                const dayTrades = trades.filter(t => t.trade_time && t.trade_time.startsWith(dateKey));
                days.push({
                    date: dateKey,
                    label: d.toLocaleDateString('en-US', {day: 'numeric', month: 'short'}),
                    pnl: calcNetPnl(dayTrades)
                });
            }

            const maxAbs = Math.max(...days.map(d => Math.abs(d.pnl)), 0.01);

            document.getElementById('chartBars').innerHTML = days.map(d => {
                const heightPercent = (Math.abs(d.pnl) / maxAbs) * 85;
                const cls = d.pnl >= 0 ? 'pos-bar' : 'neg-bar';
                const valueColor = d.pnl >= 0 ? '#3fb950' : '#f85149';
                const sign = d.pnl >= 0 ? '+' : '-';
                const displayVal = d.pnl !== 0 ? (sign + '$' + Math.abs(d.pnl).toFixed(2)) : '';
                return `
                    <div class="bar-wrapper" title="${d.label}: ${sign}$${Math.abs(d.pnl).toFixed(2)}">
                        <div class="bar-value" style="color:${valueColor};">
                            ${displayVal}
                        </div>
                        <div class="bar ${cls}" style="height: ${Math.max(heightPercent, 3)}%;"></div>
                        <div class="bar-label">${d.label}</div>
                    </div>
                `;
            }).join('');
        }

        function renderTrades(trades) {
            const container = document.getElementById('trades');
            if (!trades.length) {
                container.innerHTML = '<div class="empty">No trades found. Click Sync to load trades.</div>';
                return;
            }

            const groups = {};
            trades.forEach(t => {
                const dateKey = t.trade_time
                    ? new Date(t.trade_time).toISOString().split('T')[0]
                    : 'PENDING';
                if (!groups[dateKey]) groups[dateKey] = [];
                groups[dateKey].push(t);
            });

            const sortedDates = Object.keys(groups).sort((a, b) => {
                if (a === 'PENDING') return -1;
                if (b === 'PENDING') return 1;
                return b.localeCompare(a);
            });

            container.innerHTML = sortedDates.map((date, idx) => {
                const dayTrades = groups[date];
                const dayPnl = calcNetPnl(dayTrades);
                const dayFee = dayTrades.reduce((s, t) => s + (t.fee || 0), 0);
                const pnlClass = dayPnl >= 0 ? 'pos' : 'neg';
                const pnlSign = dayPnl >= 0 ? '+' : '-';
                const dateLabel = date === 'PENDING' ? '⏳ Open Positions' : `📅 ${formatDate(date)}`;

                return `
                    <div class="date-group" style="animation-delay: ${idx * 0.05}s">
                        <div class="date-header">
                            <div class="date-title">${dateLabel}</div>
                            <div class="date-stats">
                                <span>${dayTrades.length} trades</span>
                                ${date !== 'PENDING' ? `
                                    <span>Fee: $${dayFee.toFixed(2)}</span>
                                    <span class="${pnlClass}">Net: ${pnlSign}$${Math.abs(dayPnl).toFixed(2)}</span>
                                ` : ''}
                            </div>
                        </div>
                        ${dayTrades.map(t => renderTradeCard(t)).join('')}
                    </div>
                `;
            }).join('');
        }

        function renderTradeCard(t) {
            const time = t.trade_time
                ? new Date(t.trade_time).toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'})
                : '';
            const isOpen = !t.trade_time || (t.delta_order_id && t.delta_order_id.startsWith('open_pos_'));
            const isClosed = !isOpen;
            const netPnl = (t.pnl || 0) + (t.funding || 0) - (t.fee || 0);
            const pnlClass = netPnl >= 0 ? 'pos' : 'neg';
            const pnlSign = netPnl >= 0 ? '+' : '-';

            return `
                <div class="trade-card">
                    <div class="trade-header">
                        <span class="symbol">
                            ${t.symbol || 'N/A'} 
                            ${time ? `<span style="color:#8b949e;font-size:11px;font-weight:400;">${time}</span>` : ''}
                            ${isOpen ? '<span class="open-badge">OPEN</span>' : ''}
                            ${isClosed ? '<span class="close-badge">CLOSE</span>' : ''}
                        </span>
                        <span class="${t.side === 'buy' ? 'side-buy' : 'side-sell'}">
                            ${t.side === 'buy' ? '🟢 BUY' : '🔴 SELL'}
                        </span>
                    </div>

                    <div class="auto-info">
                        <div class="item">
                            <span class="lbl">Entry</span>
                            <span class="val">$${t.entry_price || '-'}</span>
                        </div>
                        <div class="item">
                            <span class="lbl">Exit</span>
                            <span class="val">${t.exit_price ? '$' + t.exit_price : '-'}</span>
                        </div>
                        <div class="item">
                            <span class="lbl">Size</span>
                            <span class="val">${t.size || '-'}</span>
                        </div>
                        <div class="item">
                            <span class="lbl">Fee</span>
                            <span class="val">$${(t.fee || 0).toFixed(4)}</span>
                        </div>
                        <div class="item">
                            <span class="lbl">PnL</span>
                            <span class="val ${pnlClass}">${isOpen ? '-' : pnlSign + '$' + Math.abs(netPnl).toFixed(4)}</span>
                        </div>
                        <div class="item">
                            <span class="lbl">Funding</span>
                            <span class="val">$${(t.funding || 0).toFixed(4)}</span>
                        </div>
                    </div>

                    <div class="exit-row">
                        <div class="input-box">
                            <label>Exit Price</label>
                            <input type="number" step="0.01" value="${t.exit_price || ''}"
                                class="${isOpen ? 'highlight' : ''}"
                                placeholder="Enter exit price"
                                onblur="saveExit(${t.id}, this.value)">
                        </div>
                        <div class="input-box">
                            <label>Net PnL</label>
                            <input type="text" value="${isOpen ? 'Pending' : pnlSign + '$' + Math.abs(netPnl).toFixed(4)}" readonly
                                style="background:rgba(22,27,34,0.6); color:${netPnl >= 0 ? '#3fb950' : '#f85149'}; font-weight:700;">
                        </div>
                    </div>

                    <textarea placeholder="Write your mistake or learning from this trade..."
                        onblur="saveNote(${t.id}, this.value)">${t.note || ''}</textarea>
                </div>
            `;
        }

        function formatDate(dateStr) {
            if (dateStr === 'Unknown' || dateStr === 'PENDING') return dateStr;
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('en-US', {
                day: 'numeric', month: 'short', year: 'numeric', weekday: 'long'
            });
        }

        async function saveNote(tradeId, note) {
            await fetch(`/api/trades/${tradeId}/note`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({note})
            });
        }

        async function saveExit(tradeId, exitPrice) {
            if (!exitPrice || exitPrice === '') return;
            const status = document.getElementById('status');
            status.textContent = 'Calculating PnL...';

            try {
                const res = await fetch(`/api/trades/${tradeId}/exit`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({exit_price: parseFloat(exitPrice)})
                });
                if (!res.ok) {
                    status.textContent = `Error: ${res.status}`;
                    return;
                }
                status.textContent = '✓ PnL calculated';
                loadTrades();
                setTimeout(() => status.textContent = '', 2500);
            } catch (e) {
                status.textContent = `✗ ${e.message}`;
            }
        }

        function clearFilter() {
            document.getElementById('dateFilter').value = '';
            updateDatePlaceholder();
            loadTrades();
        }

        function exportCSV() {
            const date = document.getElementById('dateFilter').value;
            const url = date ? `/api/export/csv?date=${date}` : '/api/export/csv';
            window.location.href = url;
        }

        function exportExcel() {
            const date = document.getElementById('dateFilter').value;
            const url = date ? `/api/export/excel?date=${date}` : '/api/export/excel';
            window.location.href = url;
        }

        function exportPDF() {
            const date = document.getElementById('dateFilter').value;
            const url = date ? `/api/export/pdf?date=${date}` : '/api/export/pdf';
            window.location.href = url;
        }

        async function syncOrders() {
            const btn = document.getElementById('syncBtn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.textContent = 'Syncing from Delta API...';
            try {
                const res = await fetch('/api/sync', {method: 'POST'});
                const data = await res.json();
                let msg = `✓ ${data.synced} trades synced`;
                if (data.open_positions) msg += `, ${data.open_positions} open`;
                if (data.removed_closed) msg += `, ${data.removed_closed} closed removed`;
                status.textContent = msg;
                loadTrades();
            } catch (e) {
                status.textContent = '✗ Sync failed';
            }
            btn.disabled = false;
            setTimeout(() => status.textContent = '', 5000);
        }

        document.getElementById('dateFilter').addEventListener('change', function() {
            updateDatePlaceholder();
            loadTrades();
        });
        document.getElementById('dateFilter').addEventListener('blur', updateDatePlaceholder);

        loadTrades();
        updateDatePlaceholder();
        setInterval(loadTrades, 120000);
    </script>
</body>
</html>
